name: lint

# Fast static checks only. A real image build takes hours and ~100 GB, far
# beyond a hosted runner; build locally with yocto.sh.
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run tools/lint.sh
        run: bash tools/lint.sh
