# chrony (NTP) for the Pi 5. Replaces the package's example config.
# The Pi 5 RTC has no battery unless you fit one, so after power-off the clock
# starts in the past; wrong time breaks TLS certificates and makes logs useless.
pool pool.ntp.org iburst

# Step (jump) the clock if it is more than 1 s off during the first 3 updates,
# instead of slewing it slowly over days. That is what fixes a 1970 boot clock.
makestep 1.0 3

# Copy system time to the hardware RTC every 11 min (useful with a battery).
rtcsync

driftfile /var/lib/chrony/drift
