# MyLab layer: our own image recipe + the SSH key and Wi-Fi config packages.
# Analogy: a layer is a NuGet package of build rules — it plugs extra recipes
# into the build without editing anyone else's code.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mylab"
BBFILE_PATTERN_mylab = "^${LAYERDIR}/"
BBFILE_PRIORITY_mylab = "10"

LAYERDEPENDS_mylab = "core raspberrypi"
LAYERSERIES_COMPAT_mylab = "wrynose"
