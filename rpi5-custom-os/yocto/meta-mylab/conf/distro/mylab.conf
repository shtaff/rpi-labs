# MyLab distro: poky plus the policy this image needs. Picked by
# DISTRO ?= "mylab" in conf/templates/mylab/local.conf.sample.
# Analogy: MACHINE is the hardware, the image is the package list, the distro is
# the house rules (init system, features, licences) every recipe builds under.
require conf/distro/poky.conf

DISTRO = "mylab"
DISTRO_NAME = "MyLab (based on Poky)"
# Overrides written for poky (":poky") keep applying to us.
DISTROOVERRIDES = "poky:mylab"

# poky's hook for derived distros; INIT_MANAGER in local.conf still wins.
POKY_INIT_MANAGER = "systemd"
# wifi-config (meta-mylab) requires it.
DISTRO_FEATURES:append = " wifi"

# The Pi 5 Wi-Fi/BT firmware (meta-raspberrypi) carries this licence flag.
LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"

# ROS 2 (meta-ros): its recipes carry licence names oe-core has no text for
# (e.g. "BSD"): a warning instead of an error, as in meta-ros' own CI configuration.
ERROR_QA:remove = "license-exists"
WARN_QA:append = " license-exists"
