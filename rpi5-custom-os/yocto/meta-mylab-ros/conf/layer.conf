# MyLab ROS 2 layer: puts ROS 2 and our counter_demo package into mylab-image.
# Kept apart from meta-mylab, so the base image builds without ROS and this
# layer can be dropped from bblayers.conf to get it back.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mylab-ros"
BBFILE_PATTERN_mylab-ros = "^${LAYERDIR}/"
BBFILE_PRIORITY_mylab-ros = "13"

# mylab: the image we extend. ros2-layer: meta-ros (the ROS distro layer,
# e.g. meta-ros2-jazzy, is picked in bblayers.conf).
LAYERDEPENDS_mylab-ros = "core mylab ros2-layer"
LAYERSERIES_COMPAT_mylab-ros = "wrynose"
